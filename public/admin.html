<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Reservations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .logout-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .manage-sessions-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .manage-sessions-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(132, 250, 176, 0.4);
        }

        .controls {
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .form-group {
            flex: 1;
            min-width: 300px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            opacity: 0.9;
        }

        .reservations-section {
            margin-top: 30px;
        }

        .section-title {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .reservations-grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .reservation-card {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            background: #fafafa;
            transition: all 0.3s ease;
        }

        .reservation-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .reservation-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
        }

        .reservation-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .reservation-type {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .type-general {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .type-member {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .reservation-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        .detail-item {
            padding: 8px 0;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            font-size: 0.9em;
        }

        .detail-value {
            color: #333;
            margin-top: 2px;
        }

        .children-list {
            background: white;
            padding: 10px;
            border-radius: 6px;
            margin-top: 5px;
        }

        .children-list-item {
            padding: 5px 0;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-size: 1.2em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .export-btn {
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            padding: 10px 25px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }

        .action-buttons-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn-edit, .btn-delete {
            padding: 8px 20px;
            border: none;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .btn-edit {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            color: #333;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(132, 250, 176, 0.4);
        }

        .btn-delete {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: #333;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }

        .modal-content {
            background-color: white;
            margin: 50px auto;
            padding: 30px;
            border-radius: 15px;
            max-width: 700px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .modal-header h2 {
            color: #333;
            margin: 0;
        }

        .close-btn {
            font-size: 28px;
            font-weight: bold;
            color: #aaa;
            cursor: pointer;
            border: none;
            background: none;
        }

        .close-btn:hover {
            color: #000;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group-modal {
            margin-bottom: 15px;
        }

        .form-group-modal label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group-modal input,
        .form-group-modal select,
        .form-group-modal textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .form-group-modal input:focus,
        .form-group-modal select:focus,
        .form-group-modal textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }

        .btn-save {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-cancel {
            padding: 12px 30px;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-cancel:hover {
            background: #d0d0d0;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.8);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo img {
            max-width: 150px;
            height: auto;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/images/AV%20Logo.png" alt="Alpine Village Logo">
        </div>
        <div class="header">
            <h1>Reservation Management</h1>
            <div class="header-buttons">
                <button class="manage-sessions-btn" onclick="window.location.href='/sessions'">Manage Sessions</button>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="controls">
            <div class="form-group">
                <label for="sessionSelect">Select Session</label>
                <select id="sessionSelect">
                    <option value="">-- Select a session --</option>
                </select>
            </div>
            <button class="export-btn" onclick="exportToCSV()">Export to CSV</button>
            <button class="export-btn" onclick="addNewRegistration()">Add New Registration</button>
            <button class="btn-danger" onclick="bulkDeleteCurrentSession()">Delete Current Session</button>
            <button class="btn-danger" onclick="bulkDeleteAllRegistrations()">Delete All Registrations</button>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card">
                <h3 id="totalRegistrations">0</h3>
                <p>Total Registrations</p>
            </div>
            <div class="stat-card">
                <h3 id="totalAdults">0</h3>
                <p>Total Adults</p>
            </div>
            <div class="stat-card">
                <h3 id="totalChildren">0</h3>
                <p>Total Children</p>
            </div>
            <div class="stat-card">
                <h3 id="spotsRemaining">0</h3>
                <p>Child Spots Remaining</p>
            </div>
        </div>

        <div id="reservationsContainer"></div>
    </div>

    <script>
        let currentSession = '';
        let allReservations = [];

        // Check authentication
        const authToken = localStorage.getItem('auth_token');
        if (!authToken) {
            window.location.href = '/login';
        }

        // Load all sessions
        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions/all', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('auth_token');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(data.message || 'Failed to load sessions');
                }

                if (data.success) {
                    const sessionSelect = document.getElementById('sessionSelect');
                    data.sessions.forEach(s => {
                        const option = document.createElement('option');
                        option.value = s.session;
                        option.textContent = s.session + (s.available ? '' : ' (FULL)');
                        sessionSelect.appendChild(option);
                    });
                }

                // Add event listener
                sessionSelect.addEventListener('change', (e) => {
                    currentSession = e.target.value;
                    if (currentSession) {
                        loadReservations(currentSession);
                    } else {
                        document.getElementById('reservationsContainer').innerHTML = '';
                        document.getElementById('stats').style.display = 'none';
                    }
                });
            } catch (error) {
                showError('Failed to load sessions');
            }
        }

        // Load reservations for a specific session
        async function loadReservations(session) {
            const container = document.getElementById('reservationsContainer');
            container.innerHTML = '<div class="loading">Loading reservations...</div>';

            try {
                const response = await fetch(`/api/reservations?session=${encodeURIComponent(session)}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('auth_token');
                        window.location.href = '/login';
                        return;
                    }
                    throw new Error(data.message || 'Failed to load reservations');
                }

                if (data.success) {
                    allReservations = data.reservations;
                    displayReservations(data.reservations, data.stats);
                } else {
                    showError(data.message || 'Failed to load reservations');
                }
            } catch (error) {
                showError(error.message);
            }
        }

        // Display reservations
        function displayReservations(reservations, stats) {
            const container = document.getElementById('reservationsContainer');

            // Update stats
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('totalRegistrations').textContent = stats.totalRegistrations;
            document.getElementById('totalAdults').textContent = stats.totalAdults;
            document.getElementById('totalChildren').textContent = stats.totalChildren;
            document.getElementById('spotsRemaining').textContent = stats.spotsRemaining;

            if (reservations.length === 0) {
                container.innerHTML = '<div class="no-data">No reservations found for this session.</div>';
                return;
            }

            // Separate by type
            const generalReservations = reservations.filter(r => r.type === 'general');
            const memberReservations = reservations.filter(r => r.type === 'member');

            let html = '';

            // Display general registrations
            if (generalReservations.length > 0) {
                html += '<div class="reservations-section">';
                html += '<h2 class="section-title">General Registrations (' + generalReservations.length + ')</h2>';
                html += '<div class="reservations-grid">';
                generalReservations.forEach(reservation => {
                    html += createReservationCard(reservation, 'general');
                });
                html += '</div></div>';
            }

            // Display member registrations
            if (memberReservations.length > 0) {
                html += '<div class="reservations-section">';
                html += '<h2 class="section-title">Member + Guest Registrations (' + memberReservations.length + ')</h2>';
                html += '<div class="reservations-grid">';
                memberReservations.forEach(reservation => {
                    html += createReservationCard(reservation, 'member');
                });
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        // Create a reservation card
        function createReservationCard(reservation, type) {
            const childrenDetails = reservation.children_details ?
                JSON.parse(reservation.children_details) : [];

            let html = '<div class="reservation-card">';
            html += '<div class="reservation-header">';
            html += '<div class="reservation-name">' + escapeHtml(reservation.first_name) + ' ' + escapeHtml(reservation.last_name) + '</div>';
            html += '<span class="reservation-type type-' + type + '">' + (type === 'general' ? 'General' : 'Member + Guest') + '</span>';
            html += '</div>';

            html += '<div class="reservation-details">';

            if (type === 'member') {
                html += '<div class="detail-item">';
                html += '<div class="detail-label">Member Name</div>';
                html += '<div class="detail-value">' + escapeHtml(reservation.member_first_name) + ' ' + escapeHtml(reservation.member_last_name) + '</div>';
                html += '</div>';
            }

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Email</div>';
            html += '<div class="detail-value">' + escapeHtml(reservation.email) + '</div>';
            html += '</div>';

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Phone</div>';
            html += '<div class="detail-value">' + escapeHtml(reservation.phone) + '</div>';
            html += '</div>';

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Address</div>';
            html += '<div class="detail-value">' + escapeHtml(reservation.street_address) + ', ' +
                    escapeHtml(reservation.city) + ', ' + escapeHtml(reservation.state) + ' ' +
                    escapeHtml(reservation.zip) + '</div>';
            html += '</div>';

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Adults</div>';
            html += '<div class="detail-value">' + reservation.num_adults + '</div>';
            html += '</div>';

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Children</div>';
            html += '<div class="detail-value">' + reservation.num_children + '</div>';
            html += '</div>';

            if (childrenDetails.length > 0) {
                html += '<div class="detail-item" style="grid-column: 1 / -1;">';
                html += '<div class="detail-label">Children Details</div>';
                html += '<div class="children-list">';
                childrenDetails.forEach((child, index) => {
                    html += '<div class="children-list-item">' + (index + 1) + '. ' +
                            escapeHtml(child.name) + ' (Age: ' + escapeHtml(child.age) + ')</div>';
                });
                html += '</div></div>';
            }

            if (reservation.comments) {
                html += '<div class="detail-item" style="grid-column: 1 / -1;">';
                html += '<div class="detail-label">Comments</div>';
                html += '<div class="detail-value">' + escapeHtml(reservation.comments) + '</div>';
                html += '</div>';
            }

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Request Church Info</div>';
            html += '<div class="detail-value">' + (reservation.request_church_info ? 'Yes' : 'No') + '</div>';
            html += '</div>';

            html += '<div class="detail-item">';
            html += '<div class="detail-label">Registration Date</div>';
            html += '<div class="detail-value">' + new Date(reservation.created_at).toLocaleString() + '</div>';
            html += '</div>';

            html += '</div>';

            // Add action buttons
            html += '<div class="action-buttons-container">';
            html += '<button class="btn-edit" onclick="editRegistration(' + reservation.id + ', \'' + type + '\')">Edit</button>';
            html += '<button class="btn-delete" onclick="deleteRegistration(' + reservation.id + ', \'' + type + '\', \'' + escapeHtml(reservation.first_name) + ' ' + escapeHtml(reservation.last_name) + '\')">Delete</button>';
            html += '</div>';

            html += '</div>';

            return html;
        }

        // Export to CSV
        function exportToCSV() {
            if (!currentSession || allReservations.length === 0) {
                alert('Please select a session with reservations first');
                return;
            }

            let csv = 'Type,First Name,Last Name,Email,Phone,Address,City,State,Zip,Adults,Children,Children Details,Comments,Request Church Info,Registration Date\n';

            allReservations.forEach(r => {
                const childrenDetails = r.children_details ?
                    JSON.parse(r.children_details).map(c => `${c.name} (${c.age})`).join('; ') : '';

                const row = [
                    r.type === 'general' ? 'General' : 'Member+Guest',
                    r.first_name,
                    r.last_name,
                    r.email,
                    r.phone,
                    r.street_address,
                    r.city,
                    r.state,
                    r.zip,
                    r.num_adults,
                    r.num_children,
                    childrenDetails,
                    r.comments || '',
                    r.request_church_info ? 'Yes' : 'No',
                    new Date(r.created_at).toLocaleString()
                ].map(field => `"${String(field).replace(/"/g, '""')}"`);

                csv += row.join(',') + '\n';
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `reservations-${currentSession.replace(/[^a-z0-9]/gi, '_')}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        // Logout
        async function bulkDeleteCurrentSession() {
            if (!currentSession) {
                alert('Please select a session first');
                return;
            }

            const confirmMessage = `Are you sure you want to delete ALL registrations for "${currentSession}"?\n\nThis action cannot be undone!`;
            if (!confirm(confirmMessage)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/registrations/bulk/session/${encodeURIComponent(currentSession)}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    loadReservations(); // Reload to show empty list
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting registrations:', error);
                alert('Failed to delete registrations: ' + error.message);
            }
        }

        async function bulkDeleteAllRegistrations() {
            const confirmMessage = `⚠️ WARNING ⚠️\n\nAre you sure you want to delete ALL registrations from ALL sessions?\n\nThis will delete:\n- All general registrations\n- All member registrations\n\nThis action CANNOT be undone!\n\nType "DELETE ALL" in the next prompt to confirm.`;

            if (!confirm(confirmMessage)) {
                return;
            }

            const confirmText = prompt('Type "DELETE ALL" to confirm this action:');
            if (confirmText !== 'DELETE ALL') {
                alert('Deletion cancelled - confirmation text did not match');
                return;
            }

            try {
                const response = await fetch('/api/admin/registrations/bulk/all', {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const data = await response.json();

                if (data.success) {
                    alert(data.message);
                    loadReservations(); // Reload to show empty list
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error('Error deleting all registrations:', error);
                alert('Failed to delete registrations: ' + error.message);
            }
        }

        function logout() {
            localStorage.removeItem('auth_token');
            window.location.href = '/login';
        }

        // Show error
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('reservationsContainer').innerHTML = '';
        }

        // Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Edit registration
        let currentEditId = null;
        let currentEditType = null;
        let allSessions = [];
        let isCreatingNew = false;

        async function addNewRegistration() {
            isCreatingNew = true;
            currentEditId = null;
            currentEditType = 'general'; // Default to general

            // Load all sessions for the dropdown (including inactive)
            await loadAllSessions();

            // Clear the form and set up for new registration
            document.getElementById('editModalTitle').textContent = 'Add New Registration';
            document.getElementById('memberFields').style.display = 'none';
            document.getElementById('saveButton').textContent = 'Create Registration';

            // Add registration type selector
            let typeSelector = document.getElementById('registrationTypeSelector');
            if (!typeSelector) {
                const formElement = document.getElementById('editForm');
                const typeGroup = document.createElement('div');
                typeGroup.className = 'form-group-modal';
                typeGroup.id = 'registrationTypeSelector';
                typeGroup.innerHTML = `
                    <label for="registrationType">Registration Type *</label>
                    <select id="registrationType" required onchange="toggleMemberFields()">
                        <option value="general">General</option>
                        <option value="member">Member + Guest</option>
                    </select>
                `;
                formElement.insertBefore(typeGroup, formElement.firstChild);
            } else {
                typeSelector.style.display = 'block';
                document.getElementById('registrationType').value = 'general';
            }

            // Clear all form fields
            document.getElementById('editFirstName').value = '';
            document.getElementById('editLastName').value = '';
            document.getElementById('editEmail').value = '';
            document.getElementById('editPhone').value = '';
            document.getElementById('editStreetAddress').value = '';
            document.getElementById('editCity').value = '';
            document.getElementById('editState').value = '';
            document.getElementById('editZip').value = '';
            document.getElementById('editNumAdults').value = '1';
            document.getElementById('editNumChildren').value = '0';
            document.getElementById('editComments').value = '';
            document.getElementById('editRequestChurchInfo').checked = false;
            document.getElementById('editMemberFirstName').value = '';
            document.getElementById('editMemberLastName').value = '';

            // Populate session dropdown
            const sessionSelect = document.getElementById('editSession');
            sessionSelect.innerHTML = '<option value="">Select a session...</option>';
            allSessions.forEach(session => {
                const option = document.createElement('option');
                option.value = session.name;
                option.textContent = session.name + (session.is_active ? '' : ' (Inactive)');
                // Pre-select the currently viewed session if available
                if (currentSession && session.name === currentSession) {
                    option.selected = true;
                }
                sessionSelect.appendChild(option);
            });

            // Show the modal
            document.getElementById('editModal').style.display = 'block';
        }

        async function loadAllSessions() {
            try {
                const response = await fetch('/api/sessions/all-with-inactive', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });
                const data = await response.json();
                if (data.success) {
                    allSessions = data.sessions;
                }
            } catch (error) {
                console.error('Error loading sessions:', error);
            }
        }

        function toggleMemberFields() {
            const registrationType = document.getElementById('registrationType').value;
            currentEditType = registrationType;
            if (registrationType === 'member') {
                document.getElementById('memberFields').style.display = 'block';
            } else {
                document.getElementById('memberFields').style.display = 'none';
            }
        }

        async function editRegistration(id, type) {
            isCreatingNew = false;
            currentEditId = id;
            currentEditType = type;

            // Find the registration in allReservations
            const registration = allReservations.find(r => r.id === id);
            if (!registration) {
                alert('Registration not found');
                return;
            }

            // Load all sessions for the dropdown (including inactive)
            await loadAllSessions();

            // Hide registration type selector when editing
            const typeSelector = document.getElementById('registrationTypeSelector');
            if (typeSelector) {
                typeSelector.style.display = 'none';
            }

            // Populate the modal with registration data
            document.getElementById('editModalTitle').textContent = 'Edit ' + (type === 'general' ? 'General' : 'Member') + ' Registration';
            document.getElementById('saveButton').textContent = 'Save Changes';

            if (type === 'member') {
                document.getElementById('memberFields').style.display = 'block';
                document.getElementById('editMemberFirstName').value = registration.member_first_name || '';
                document.getElementById('editMemberLastName').value = registration.member_last_name || '';
            } else {
                document.getElementById('memberFields').style.display = 'none';
            }

            document.getElementById('editFirstName').value = registration.first_name;
            document.getElementById('editLastName').value = registration.last_name;
            document.getElementById('editEmail').value = registration.email;
            document.getElementById('editPhone').value = registration.phone;
            document.getElementById('editStreetAddress').value = registration.street_address;
            document.getElementById('editCity').value = registration.city;
            document.getElementById('editState').value = registration.state;
            document.getElementById('editZip').value = registration.zip;
            document.getElementById('editNumAdults').value = registration.num_adults;
            document.getElementById('editNumChildren').value = registration.num_children;
            document.getElementById('editComments').value = registration.comments || '';
            document.getElementById('editRequestChurchInfo').checked = registration.request_church_info;

            // Populate session dropdown
            const sessionSelect = document.getElementById('editSession');
            sessionSelect.innerHTML = '';
            allSessions.forEach(session => {
                const option = document.createElement('option');
                option.value = session.name;
                option.textContent = session.name + (session.is_active ? '' : ' (Inactive)');
                if (session.name === registration.session) {
                    option.selected = true;
                }
                sessionSelect.appendChild(option);
            });

            // Show the modal
            document.getElementById('editModal').style.display = 'block';
        }

        async function saveRegistration() {
            const data = {
                first_name: document.getElementById('editFirstName').value,
                last_name: document.getElementById('editLastName').value,
                email: document.getElementById('editEmail').value,
                phone: document.getElementById('editPhone').value,
                street_address: document.getElementById('editStreetAddress').value,
                city: document.getElementById('editCity').value,
                state: document.getElementById('editState').value,
                zip: document.getElementById('editZip').value,
                num_adults: parseInt(document.getElementById('editNumAdults').value),
                num_children: parseInt(document.getElementById('editNumChildren').value),
                comments: document.getElementById('editComments').value,
                request_church_info: document.getElementById('editRequestChurchInfo').checked,
                session: document.getElementById('editSession').value
            };

            if (currentEditType === 'member') {
                data.member_first_name = document.getElementById('editMemberFirstName').value;
                data.member_last_name = document.getElementById('editMemberLastName').value;
            }

            try {
                let response;
                if (isCreatingNew) {
                    // Create new registration
                    response = await fetch(`/api/register/${currentEditType}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                } else {
                    // Update existing registration
                    response = await fetch(`/api/admin/registrations/${currentEditType}/${currentEditId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify(data)
                    });
                }

                const result = await response.json();

                if (result.success) {
                    closeEditModal();
                    alert(isCreatingNew ? 'Registration created successfully!' : 'Registration updated successfully!');
                    // If a session was selected, reload it; otherwise stay on current view
                    if (currentSession) {
                        loadReservations(currentSession);
                    } else if (data.session) {
                        // Switch to the newly selected session
                        document.getElementById('sessionSelect').value = data.session;
                        currentSession = data.session;
                        loadReservations(data.session);
                    }
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error saving registration:', error);
                alert('Failed to save registration');
            }
        }

        async function deleteRegistration(id, type, name) {
            if (!confirm(`Are you sure you want to delete the registration for ${name}? This action cannot be undone.`)) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/registrations/${type}/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                const result = await response.json();

                if (result.success) {
                    alert('Registration deleted successfully!');
                    loadReservations(currentSession);
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting registration:', error);
                alert('Failed to delete registration');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            currentEditId = null;
            currentEditType = null;
            isCreatingNew = false;
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target === modal) {
                closeEditModal();
            }
        }

        // Initialize
        loadSessions();
    </script>

    <!-- Edit Registration Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editModalTitle">Edit Registration</h2>
                <button class="close-btn" onclick="closeEditModal()">&times;</button>
            </div>

            <form id="editForm" onsubmit="event.preventDefault(); saveRegistration();">
                <div id="memberFields" style="display: none;">
                    <h3 style="color: #f5576c; margin-bottom: 15px;">Member Information</h3>
                    <div class="form-row">
                        <div class="form-group-modal">
                            <label for="editMemberFirstName">Member First Name</label>
                            <input type="text" id="editMemberFirstName">
                        </div>
                        <div class="form-group-modal">
                            <label for="editMemberLastName">Member Last Name</label>
                            <input type="text" id="editMemberLastName">
                        </div>
                    </div>
                    <h3 style="color: #f5576c; margin: 20px 0 15px;">Guest Information</h3>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="editFirstName">First Name *</label>
                        <input type="text" id="editFirstName" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="editLastName">Last Name *</label>
                        <input type="text" id="editLastName" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="editEmail">Email *</label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="editPhone">Phone *</label>
                        <input type="tel" id="editPhone" required>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="editStreetAddress">Street Address *</label>
                    <input type="text" id="editStreetAddress" required>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="editCity">City *</label>
                        <input type="text" id="editCity" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="editState">State *</label>
                        <input type="text" id="editState" required>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="editZip">Zip Code *</label>
                    <input type="text" id="editZip" required>
                </div>

                <div class="form-row">
                    <div class="form-group-modal">
                        <label for="editNumAdults">Adults & Older Children (6th grade+) *</label>
                        <input type="number" id="editNumAdults" min="1" max="10" required>
                    </div>
                    <div class="form-group-modal">
                        <label for="editNumChildren">Number of Children *</label>
                        <input type="number" id="editNumChildren" min="0" max="10" required>
                    </div>
                </div>

                <div class="form-group-modal">
                    <label for="editSession">Session *</label>
                    <select id="editSession" required>
                        <option value="">Select a session...</option>
                    </select>
                </div>

                <div class="form-group-modal">
                    <label for="editComments">Comments</label>
                    <textarea id="editComments" rows="3"></textarea>
                </div>

                <div class="form-group-modal">
                    <label style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="editRequestChurchInfo" style="width: auto;">
                        Request Church Information
                    </label>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-save" id="saveButton">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2024 Trinity Baptist Church
    </footer>
</body>
</html>
